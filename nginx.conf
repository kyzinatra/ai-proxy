# ai-proxy NGINX site config
# Usage:
# 1) Replace ai.kyzinatra.ru below with your real domain
# 2) Place this file at /etc/nginx/sites-available/ai-proxy.conf and symlink to sites-enabled
#    ln -s /etc/nginx/sites-available/ai-proxy.conf /etc/nginx/sites-enabled/ai-proxy.conf
# 3) Ensure SSL cert files exist (Let's Encrypt paths shown) or adjust accordingly
# 4) Test and reload: nginx -t && systemctl reload nginx

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ai.kyzinatra.ru www.ai.kyzinatra.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.kyzinatra.ru www.ai.kyzinatra.ru;

    ssl_certificate ./cert/fullchain.pem;
    ssl_certificate_key ./cert/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 50m;
    send_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}